name: Przegląd zasad

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  zasady:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /przeglad-zasad
            Pull request numer ${{ github.event.pull_request.number }} w ${{ github.repository }}.
            Wynik opublikuj jednym komentarzem: gh pr comment ${{ github.event.pull_request.number }} --body "<wynik>".
          claude_args: '--allowedTools "Bash(gh pr diff:*)" "Bash(gh pr view:*)" "Bash(gh pr comment:*)" "Read" "Glob" "Grep"'
